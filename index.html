<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ubuntu@sandbox-vm: ~</title>
<meta name="description" content="A local, offline Ubuntu terminal simulator that runs Bash commands and plain English requests entirely in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23300a24'/><circle cx='8' cy='8' r='5' fill='none' stroke='%238ae234' stroke-width='2'/></svg>">

<style>
  /* ---------- Theme tokens ---------- */
  :root {
    --aubergine: #2c001e;
    --panel: #300a24;
    --panel-edge: #4a1236;
    --header: #1d1d20;
    --header-edge: #0d0d0f;
    --text: #eeeeec;
    --muted: #9a8f96;
    --green: #8ae234;
    --blue: #729fcf;
    --red: #ef2929;
    --yellow: #fce94f;
    --cyan: #34e2e2;
    --magenta: #ad7fa8;
    --gray: #888a85;
    --white: #ffffff;
    --close: #df4b33;
    --minimize: #f0c442;
    --maximize: #67a637;
    --font-mono: 'Ubuntu Mono', 'UbuntuMono', Consolas, 'DejaVu Sans Mono', 'Liberation Mono', Menlo, Monaco, monospace;
    --font-ui: 'Ubuntu', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --pad-x: clamp(12px, 2.2vw, 30px);
    --pad-y: clamp(10px, 1.8vw, 24px);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: grid;
    place-items: center;
    padding: clamp(8px, 2vw, 28px);
    background-color: var(--aubergine);
    background-image:
      radial-gradient(circle at 50% 0%, rgba(255, 255, 255, .07) 0%, rgba(255, 255, 255, 0) 45%),
      radial-gradient(circle at 50% 125%, rgba(0, 0, 0, .55) 0%, rgba(0, 0, 0, 0) 60%);
    color: var(--text);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Window shell ---------- */
  .window {
    display: grid;
    grid-template-rows: auto 1fr auto;
    width: min(1120px, 100%);
    height: min(760px, 100%);
    overflow: hidden;
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    background: var(--panel);
    box-shadow: 0 24px 70px rgba(0, 0, 0, .6), 0 2px 0 rgba(255, 255, 255, .04) inset;
  }

  .titlebar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    padding: 0 14px;
    height: 42px;
    background: linear-gradient(#2a2a2e, var(--header));
    border-bottom: 1px solid var(--header-edge);
    user-select: none;
  }

  .controls {
    display: flex;
    gap: 8px;
    justify-self: start;
  }

  .dot {
    width: 13px;
    height: 13px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .28);
    cursor: default;
  }

  .dot--close { background: var(--close); }
  .dot--minimize { background: var(--minimize); }
  .dot--maximize { background: var(--maximize); }
  .dot:hover { filter: brightness(1.15); }

  .titlebar__title {
    grid-column: 2;
    margin: 0;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    color: #d8d4d6;
    white-space: nowrap;
  }

  .titlebar__meta {
    grid-column: 3;
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px;
    border: 1px solid #3a3a40;
    border-radius: 999px;
    background: #26262a;
    font-family: var(--font-mono);
    white-space: nowrap;
  }

  .status::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gray);
  }

  .status[data-state="ready"]::before { background: var(--green); }
  .status[data-state="busy"]::before { background: var(--yellow); animation: pulse 1s ease-in-out infinite; }
  .status[data-state="error"]::before { background: var(--red); }

  @keyframes pulse { 50% { opacity: .25; } }

  /* ---------- Terminal viewport ---------- */
  .screen {
    position: relative;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: var(--pad-y) var(--pad-x) calc(var(--pad-y) + 8px);
    background: var(--panel);
    font-family: var(--font-mono);
    font-size: 15px;
    line-height: 1.5;
    cursor: text;
    scrollbar-color: #6b3b5b transparent;
    scrollbar-width: thin;
  }

  .screen::-webkit-scrollbar { width: 11px; }
  .screen::-webkit-scrollbar-track { background: transparent; }
  .screen::-webkit-scrollbar-thumb {
    background: #5b2f4b;
    border: 3px solid var(--panel);
    border-radius: 999px;
  }
  .screen::-webkit-scrollbar-thumb:hover { background: #7a4162; }

  .output { margin: 0; }

  .line {
    margin: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    color: var(--text);
  }

  /* Unix token colours */
  .user { color: var(--green); font-weight: 700; }
  .host { color: var(--green); font-weight: 700; }
  .path { color: var(--blue); font-weight: 700; }
  .prompt-sym { color: var(--white); font-weight: 700; }

  .t-dir { color: var(--blue); font-weight: 700; }
  .t-exec { color: var(--green); font-weight: 700; }
  .t-link { color: var(--cyan); }
  .t-err { color: var(--red); }
  .t-warn { color: var(--yellow); }
  .t-ok { color: var(--green); }
  .t-info { color: var(--magenta); }
  .t-dim { color: var(--gray); }

  .block {
    margin: 4px 0;
    padding: 6px 10px;
    border-left: 3px solid var(--panel-edge);
    background: rgba(255, 255, 255, .035);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    color: #ded8dc;
  }

  .block--ai { border-left-color: var(--blue); }
  .block--error { border-left-color: var(--red); color: #ffb3a7; }
  .block--ok { border-left-color: var(--green); }

  /* The block cursor is a layout spacer that only shows on an empty prompt.
     Once you type, the native caret takes over at the true text position. */
  .cursor {
    flex: none;
    width: 8px;
    height: 1.05em;
    margin-right: 1px;
    vertical-align: text-bottom;
    background: var(--text);
    visibility: hidden;
    animation: blink 1.05s steps(1, end) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- Input row ---------- */
  .prompt-row {
    display: flex;
    align-items: baseline;
    gap: 0;
    min-width: 0;
  }

  .prompt-row > .ps1 { flex: none; }

  .prompt-input {
    flex: 1 1 auto;
    min-width: 0;
    padding: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: inherit;
    line-height: inherit;
    caret-color: var(--text);
  }

  .prompt-input::selection { background: #5c3566; color: var(--white); }

  .prompt-row.is-empty .cursor { visibility: visible; }
  .prompt-row.is-empty .prompt-input { caret-color: transparent; }
  .prompt-row.is-busy .prompt-input { opacity: .45; }

  /* ---------- Hint bar ---------- */
  .hintbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
    padding: 7px 14px;
    border-top: 1px solid var(--header-edge);
    background: #241019;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--muted);
  }

  .hintbar kbd {
    padding: 1px 5px;
    border: 1px solid #4a3a44;
    border-radius: 4px;
    background: #1b0d14;
    color: #c9bfc5;
    font-family: inherit;
    font-size: 11px;
  }

  .hintbar__sep { color: #4a3a44; }

  .hint {
    padding: 1px 7px;
    border: 1px dashed #5b2f4b;
    border-radius: 999px;
    color: #c8a8bd;
    cursor: pointer;
    white-space: nowrap;
  }

  .hint:hover { border-style: solid; color: var(--white); }

  @media (max-width: 720px) {
    .titlebar { grid-template-columns: auto 1fr; }
    .titlebar__meta { display: none; }
    .titlebar__title { justify-self: center; }
    .screen { font-size: 13.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cursor, .status[data-state="busy"]::before { animation: none; }
  }
</style>
</head>

<body>
<main class="window" aria-label="Ubuntu terminal simulator">
  <header class="titlebar">
    <div class="controls" aria-hidden="true">
      <button class="dot dot--close" tabindex="-1" type="button"></button>
      <button class="dot dot--minimize" tabindex="-1" type="button"></button>
      <button class="dot dot--maximize" tabindex="-1" type="button"></button>
    </div>
    <h1 class="titlebar__title">ubuntu@sandbox-vm: ~</h1>
    <div class="titlebar__meta">
      <span class="status" id="status" data-state="boot" role="status" aria-live="polite">booting</span>
      <span>Ubuntu 26.04 LTS</span>
    </div>
  </header>

  <section class="screen" id="screen" tabindex="-1" aria-label="Terminal output">
    <div class="output" id="output" role="log" aria-live="polite" aria-relevant="additions text"></div>
  </section>

  <footer class="hintbar">
    <span>try:</span>
    <span class="hint" data-cmd="ls -la">ls -la</span>
    <span class="hint" data-cmd="help">help</span>
    <span class="hint" data-cmd="apk help">apk help</span>
    <span class="hint" data-cmd="sh -c &quot;echo hello | tr a-z A-Z&quot;">sh pipeline</span>
    <span class="hint" data-cmd="create a folder called invoices">create a folder called invoices</span>
    <span class="hint" data-cmd="remove everything inside Documents">remove everything inside Documents</span>
    <span class="hintbar__sep">|</span>
    <span><kbd>Enter</kbd> run</span>
    <span class="hintbar__sep">|</span>
    <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> history</span>
  </footer>
</main>

<script type="module">
/* =====================================================================
   Ubuntu 26.04 LTS Terminal Simulator
   Single-file build. No build step, no server, no API keys.

   Two engines route every keystroke-level command:
     Route A  native Bash   - parsed and applied to an in-memory VFS.
     Route B  Kernel AI     - plain English, compiled by WebLLM to JSON.
   ===================================================================== */

const WEBLLM_CDN = 'https://esm.run/@mlc-ai/web-llm';
const MODEL_ID = 'Llama-3.2-1B-Instruct-q4f16_1-MLC';
const MAX_HISTORY = 100;
const MAX_RENDERED_LINES = 2500;

const cfg = {
  user: 'ubuntu',
  host: 'sandbox-vm',
  root: '~',
  aiEnabled: true
};

/* ---------------------------------------------------------------------
   1. Virtual File System
   ------------------------------------------------------------------ */
const DIR_MIME = 'inode/directory';

function makeDir(name, children = {}) {
  return { name, type: 'dir', children };
}

function makeFile(name, content = '', extra = {}) {
  return { name, type: 'file', content, ...extra };
}

const VFS = makeDir(cfg.root, {
  Documents: makeDir('Documents', {
    'notes.txt': makeFile('notes.txt', 'Remember: the AI engine runs locally, so nothing leaves this browser tab.\n')
  }),
  Downloads: makeDir('Downloads', {}),
  Desktop: makeDir('Desktop', {
    'shortcuts.txt': makeFile('shortcuts.txt', 'Route A: native Bash utilities.\nRoute B: plain English, compiled by the local model.\n')
  }),
  'welcome.txt': makeFile(
    'welcome.txt',
    [
      'Welcome to Ubuntu 26.04 LTS (sandbox-vm)',
      '',
      'This terminal has two engines behind one prompt.',
      '  Route A  native Bash utilities run instantly against a local file system.',
      '  Route B  plain English is compiled by a local language model into a command.',
      '',
      'Try:  ls -la',
      '      mkdir projects',
      '      create a folder called invoices',
      '',
      'Nothing is uploaded. Every byte stays in this tab.',
      ''
    ].join('\n')
  )
});

/* Pristine copy of the factory image, used by the `reset` command. */
const FACTORY_IMAGE = cloneVfs();

/* ---------------------------------------------------------------------
   2. Path helpers
   ------------------------------------------------------------------ */
function isDir(node) {
  return Boolean(node) && node.type === 'dir';
}

/** Resolve '.' and '..' in a raw segment list. */
function normalizeSegments(rawSegments) {
  const segments = [];
  for (const raw of rawSegments) {
    if (raw === '' || raw === '.') continue;
    if (raw === '..') { segments.pop(); continue; }
    segments.push(raw);
  }
  return segments;
}

/** Turn a user-supplied path (absolute, ~, or relative) into absolute tokens. */
function resolveTokens(input, cwdTokens = []) {
  const value = String(input ?? '').trim();
  if (value === '' || value === '.' || value === './') return [...cwdTokens];
  if (value === cfg.root || value === cfg.root + '/') return [];
  if (value.startsWith(cfg.root + '/')) return normalizeSegments(value.slice(cfg.root.length).split('/'));
  if (value.startsWith('/')) return normalizeSegments(value.split('/'));
  return normalizeSegments([...cwdTokens, ...value.split('/')]);
}

function getNode(tokens) {
  let node = VFS;
  for (const token of tokens) {
    if (!isDir(node)) return null;
    const next = node.children[token];
    if (!next) return null;
    node = next;
  }
  return node;
}

/** Find a node. Returns { node, tokens } or null. */
function lookup(path, cwdTokens) {
  const tokens = resolveTokens(path, cwdTokens);
  const node = getNode(tokens);
  return node ? { node, tokens } : null;
}

function parentOf(path, cwdTokens) {
  const tokens = resolveTokens(path, cwdTokens);
  const name = tokens[tokens.length - 1] ?? '';
  const parentTokens = tokens.slice(0, -1);
  const parent = getNode(parentTokens);
  return isDir(parent) ? { parent, parentTokens, name, tokens } : null;
}

function childNames(dir) {
  return Object.keys(dir.children).sort((a, b) => a.localeCompare(b));
}

function displayPath(tokens) {
  return tokens.length === 0 ? cfg.root : cfg.root + '/' + tokens.join('/');
}

function makeUniqueName(parent, base) {
  if (!parent.children[base]) return base;
  let counter = 1;
  let candidate = `${base}.${counter}`;
  while (parent.children[candidate]) candidate = `${base}.${++counter}`;
  return candidate;
}

function cloneVfs(node = VFS) {
  if (node.type === 'file') {
    const { name, type, content, mode } = node;
    return mode ? { name, type, content, mode } : { name, type, content };
  }
  const children = {};
  for (const key of Object.keys(node.children)) children[key] = cloneVfs(node.children[key]);
  return { name: node.name, type: 'dir', children };
}

function countEntries(node) {
  return node.type === 'dir' ? Object.keys(node.children).length : 0;
}

/* ---------------------------------------------------------------------
   3. Terminal view
   ------------------------------------------------------------------ */
const screenEl = document.getElementById('screen');
const outputEl = document.getElementById('output');
const statusEl = document.getElementById('status');
const hintbarEl = document.querySelector('.hintbar');

const state = {
  cwd: [],
  history: [],
  historyIndex: 0,
  draft: '',
  busy: false,
  renderedLines: 0
};

function escapeHtml(value) {
  return String(value).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
}

/** Output always goes above the live prompt row, never below it. */
function insertOutput(node) {
  if (promptRow && promptRow.parentNode === outputEl) outputEl.insertBefore(node, promptRow);
  else outputEl.appendChild(node);
}

function trimLines() {
  while (outputEl.childElementCount > MAX_RENDERED_LINES && outputEl.firstElementChild !== promptRow) {
    outputEl.firstElementChild.remove();
  }
}

function writeLine(html = '', className = '') {
  const line = document.createElement('p');
  line.className = className ? `line ${className}` : 'line';
  line.innerHTML = html;
  insertOutput(line);
  state.renderedLines += 1;
  trimLines();
  return line;
}

function writeText(text, className = '') {
  const lines = String(text).replace(/\n+$/, '').split('\n');
  for (const line of lines) writeLine(escapeHtml(line), className);
}

function writeBlock(text, variant = '') {
  const block = document.createElement('div');
  block.className = variant ? `block ${variant}` : 'block';
  block.textContent = text;
  insertOutput(block);
  state.renderedLines += 1;
  trimLines();
  return block;
}

/** Build the coloured `ubuntu@sandbox-vm:~$` prompt token. */
function promptHtml() {
  return `<span class="user">${escapeHtml(cfg.user)}</span>@<span class="host">${escapeHtml(cfg.host)}</span>:<span class="path">${escapeHtml(displayPath(state.cwd))}</span><span class="prompt-sym">$</span>`;
}

function scrollToBottom() {
  screenEl.scrollTop = screenEl.scrollHeight;
}

/* ---------------------------------------------------------------------
   4. Prompt input
   ------------------------------------------------------------------ */
let promptRow = null;
let inputEl = null;

function buildPromptRow() {
  const row = document.createElement('div');
  row.className = 'prompt-row';

  const ps1 = document.createElement('span');
  ps1.className = 'ps1';
  ps1.setAttribute('aria-hidden', 'true');

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'prompt-input';
  input.id = 'prompt';
  input.autocomplete = 'off';
  input.autocapitalize = 'off';
  input.spellcheck = false;
  input.setAttribute('autocorrect', 'off');
  input.setAttribute('aria-label', 'Terminal command input');
  input.setAttribute('enterkeyhint', 'go');

  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  cursor.setAttribute('aria-hidden', 'true');

  row.append(ps1, input, cursor);
  outputEl.appendChild(row);
  trimLines();

  row.addEventListener('mousedown', (event) => {
    if (event.target === input) return;
    event.preventDefault();
    input.focus();
  });

  input.addEventListener('input', () => {
    state.draft = input.value;
    syncCursorState();
  });

  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      submit(input.value);
      return;
    }
    if (event.key === 'ArrowUp') { event.preventDefault(); recall(-1); return; }
    if (event.key === 'ArrowDown') { event.preventDefault(); recall(1); return; }
    if (event.key === 'l' && event.ctrlKey) { event.preventDefault(); clearScreen(); return; }
    if (event.key === 'c' && event.ctrlKey) {
      event.preventDefault();
      const pending = input.value;
      input.value = '';
      state.draft = '';
      writeLine(`${promptHtml()} ${escapeHtml(pending)}`);
      if (pending.trim() === '') writeLine('');
      setPrompt();
      return;
    }
    if (event.key === 'u' && event.ctrlKey) { event.preventDefault(); input.value = ''; state.draft = ''; return; }
  });

  return { row, input, cursor };
}

function setPrompt() {
  promptRow.querySelector('.ps1').innerHTML = promptHtml();
  promptRow.classList.remove('is-busy');
  inputEl.disabled = false;
  syncCursorState();
}

function setBusyPrompt() {
  promptRow.querySelector('.ps1').innerHTML = promptHtml();
  promptRow.classList.add('is-busy');
  inputEl.disabled = true;
}

/** Show the block cursor only while the prompt line is empty. */
function syncCursorState() {
  promptRow.classList.toggle('is-empty', inputEl.value.length === 0);
}

function focusInput() {
  if (!inputEl) return;
  requestAnimationFrame(() => {
    if (document.hidden) return;
    if (inputEl.disabled) return;
    if (document.activeElement === inputEl) return;
    inputEl.focus({ preventScroll: true });
  });
}

function recall(direction) {
  if (state.history.length === 0) return;
  if (direction < 0 && state.historyIndex === state.history.length) state.draft = inputEl.value;
  state.historyIndex = Math.max(0, Math.min(state.history.length, state.historyIndex + direction));
  inputEl.value = state.historyIndex >= state.history.length ? state.draft : state.history[state.historyIndex];
  inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
  syncCursorState();
}

function pushHistory(command) {
  if (!command || state.history[state.history.length - 1] !== command) state.history.push(command);
  if (state.history.length > MAX_HISTORY) state.history.shift();
  state.historyIndex = state.history.length;
  state.draft = '';
}

function clearScreen() {
  outputEl.replaceChildren();
  state.renderedLines = 0;
  if (promptRow) outputEl.appendChild(promptRow);
  setPrompt();
  scrollToBottom();
}

function rebuildPrompt() {
  const { row, input } = buildPromptRow();
  promptRow = row;
  inputEl = input;
  setPrompt();
  scrollToBottom();
  focusInput();
}

function setStatus(label, stateName) {
  statusEl.textContent = label;
  statusEl.dataset.state = stateName;
}

/* ---------------------------------------------------------------------
   5. Command catalog
   ------------------------------------------------------------------ */
const NATIVE_COMMANDS = ['ls', 'mkdir', 'touch', 'rm', 'rmdir', 'cd', 'pwd', 'cat', 'echo', 'clear', 'help', 'date', 'whoami', 'apk', 'run', 'sh'];

const USAGE = {
  ls: 'ls [-a] [-l] [path]',
  mkdir: 'mkdir [-p] <name> [name...]',
  touch: 'touch <file> [file...]',
  rm: 'rm [-r] <path> [path...]',
  rmdir: 'rmdir <dir> [dir...]',
  cd: 'cd [path]',
  pwd: 'pwd',
  cat: 'cat <file> [file...]',
  echo: 'echo <text>',
  clear: 'clear',
  help: 'help [command]',
  date: 'date',
  whoami: 'whoami',
  apk: 'apk <update|add|del|search|info|list|repo|proxy|run> [...]',
  run: 'run <script> [argument...]',
  sh: 'sh -c "<script>"'
};

const DESCRIPTIONS = {
  ls: 'list directory contents',
  mkdir: 'create directories, -p for parents',
  touch: 'create empty files or update timestamps',
  rm: 'remove files and directories',
  rmdir: 'remove empty directories',
  cd: 'change the working directory',
  pwd: 'print the working directory',
  cat: 'print file contents',
  echo: 'print text, supports > and >> redirection',
  clear: 'clear the screen',
  help: 'list the supported commands',
  date: 'print the current date and time',
  whoami: 'print the current user',
  apk: 'install real Alpine packages, verified in the browser',
  run: 'run a script that an installed package provided',
  sh: 'run a shell script through the POSIX interpreter'
};

function tokenize(command) {
  const tokens = [];
  const pattern = /"([^"]*)"|'([^']*)'|(\S+)/g;
  let match;
  while ((match = pattern.exec(command)) !== null) {
    tokens.push(match[1] ?? match[2] ?? match[3]);
  }
  return tokens;
}

/* ---------------------------------------------------------------------
   6. Route A - native Bash engine
   ------------------------------------------------------------------ */
class ShellError extends Error {}

function listDirectory(args) {
  const entries = args.filter((a) => !a.startsWith('-') && a !== '--');
  const flags = args.filter((a) => a.startsWith('-') && a !== '--').join('');
  const showAll = flags.includes('a');
  const long = flags.includes('l');

  if (entries.length > 1) throw new ShellError(`ls: extra operand '${entries[1]}'`);

  const target = entries[0] ?? '.';
  const found = lookup(target, state.cwd);
  if (!found) throw new ShellError(`ls: cannot access '${target}': No such file or directory`);

  if (!isDir(found.node)) {
    if (long) {
      writeLine(`-rw-r--r-- 1 ${cfg.user} ${cfg.user} ${String(found.node.content.length).padStart(6)} ${escapeHtml(found.node.name)}`);
    } else {
      writeLine(escapeHtml(found.node.name));
    }
    return;
  }

  if (long) writeLine(`total ${countEntries(found.node)}`);
  const names = childNames(found.node);
  const visible = showAll ? ['.', '..', ...names] : names;
  if (visible.length === 0) return;

  if (long) {
    for (const name of visible) {
      const node = name === '.' ? found.node : name === '..' ? found.node : found.node.children[name];
      const isFolder = isDir(node);
      const mode = isFolder ? 'drwxr-xr-x' : '-rw-r--r--';
      const size = isFolder ? 4096 : (node?.content?.length ?? 0);
      const cls = isFolder ? 't-dir' : 'line';
      writeLine(
        `${mode} 1 ${cfg.user} ${cfg.user} ${String(size).padStart(6)} ${escapeHtml(name)}`,
        cls
      );
    }
    return;
  }

  writeLine(visible.map((name) => {
    const node = found.node.children[name];
    const isFolder = isDir(node);
    return `<span class="${isFolder ? 't-dir' : ''}">${escapeHtml(name)}${isFolder ? '/' : ''}</span>`;
  }).join('  '));
}

function makeDirectory(args) {
  const parents = args.some((a) => a.startsWith('-') && a.includes('p'));
  const names = args.filter((a) => !a.startsWith('-'));
  if (names.length === 0) throw new ShellError('mkdir: missing operand');
  for (const name of names) {
    if (parents) {
      const tokens = resolveTokens(name, state.cwd);
      let node = VFS;
      for (const token of tokens) {
        if (!isDir(node.children[token])) node.children[token] = makeDir(token);
        node = node.children[token];
      }
      continue;
    }
    const target = parentOf(name, state.cwd);
    if (!target) throw new ShellError(`mkdir: cannot create directory '${name}': No such file or directory`);
    if (target.parent.children[target.name]) {
      throw new ShellError(`mkdir: cannot create directory '${name}': File exists`);
    }
    target.parent.children[target.name] = makeDir(target.name);
  }
}

function touchFiles(args) {
  if (args.length === 0) throw new ShellError('touch: missing file operand');
  for (const name of args.filter((a) => !a.startsWith('-'))) {
    const target = parentOf(name, state.cwd);
    if (!target) throw new ShellError(`touch: cannot touch '${name}': No such file or directory`);
    if (!target.parent.children[target.name]) {
      target.parent.children[target.name] = makeFile(target.name, '');
    }
  }
}

function removeEntries(args) {
  const recursive = args.some((a) => a.startsWith('-') && a.includes('r'));
  const names = args.filter((a) => !a.startsWith('-'));
  if (names.length === 0) throw new ShellError('rm: missing operand');

  for (const name of names) {
    const found = lookup(name, state.cwd);
    if (!found) throw new ShellError(`rm: cannot remove '${name}': No such file or directory`);
    if (found.tokens.length === 0) throw new ShellError('rm: refusing to remove the root directory');
    if (isDir(found.node) && !recursive) {
      throw new ShellError(`rm: cannot remove '${name}': Is a directory`);
    }
    const parent = getNode(found.tokens.slice(0, -1));
    delete parent.children[found.node.name];
    if (found.tokens.length <= state.cwd.length) state.cwd = [];
  }
}

function removeEmptyDirectories(args) {
  if (args.length === 0) throw new ShellError('rmdir: missing operand');
  for (const name of args.filter((a) => !a.startsWith('-'))) {
    const found = lookup(name, state.cwd);
    if (!found) throw new ShellError(`rmdir: failed to remove '${name}': No such file or directory`);
    if (!isDir(found.node)) throw new ShellError(`rmdir: failed to remove '${name}': Not a directory`);
    if (countEntries(found.node) > 0) throw new ShellError(`rmdir: failed to remove '${name}': Directory not empty`);
    const parent = getNode(found.tokens.slice(0, -1));
    delete parent.children[found.node.name];
  }
}

function changeDirectory(args) {
  const target = args[0] ?? cfg.root;
  const found = lookup(target, state.cwd);
  if (!found) throw new ShellError(`bash: cd: ${target}: No such file or directory`);
  if (!isDir(found.node)) throw new ShellError(`bash: cd: ${target}: Not a directory`);
  state.cwd = found.tokens;
}

function printFile(args) {
  if (args.length === 0) throw new ShellError('cat: missing operand');
  for (const name of args.filter((a) => !a.startsWith('-'))) {
    const found = lookup(name, state.cwd);
    if (!found) throw new ShellError(`cat: ${name}: No such file or directory`);
    if (isDir(found.node)) throw new ShellError(`cat: ${name}: Is a directory`);
    writeText(found.node.content);
  }
}

function echoText(args) {
  const redirectAt = args.findIndex((a) => a === '>' || a === '>>');
  if (redirectAt === -1) {
    writeText(args.join(' '));
    return;
  }
  const text = args.slice(0, redirectAt).join(' ');
  const targetName = args[redirectAt + 1];
  if (!targetName) throw new ShellError('bash: syntax error near unexpected token `newline\'');
  const target = parentOf(targetName, state.cwd);
  if (!target) throw new ShellError(`bash: ${targetName}: No such file or directory`);
  const append = args[redirectAt] === '>>';
  const existing = target.parent.children[target.name];
  const previous = append && existing ? existing.content : '';
  target.parent.children[target.name] = makeFile(target.name, `${previous}${text}\n`);
}

function printHelp(args) {
  const topic = args[0];
  if (topic) {
    const command = topic.toLowerCase();
    if (!USAGE[command]) throw new ShellError(`help: no help topics match '${topic}'`);
    writeLine(`<span class="t-ok">${escapeHtml(command)}</span> - ${escapeHtml(DESCRIPTIONS[command])}`);
    writeLine(`usage: ${escapeHtml(USAGE[command])}`);
    return;
  }
  writeLine('<span class="t-ok">Native Bash commands</span> (Route A, instant):');
  for (const command of NATIVE_COMMANDS) {
    writeLine(`  <span class="t-dir">${escapeHtml(command.padEnd(8))}</span>${escapeHtml(DESCRIPTIONS[command])}`);
  }
  writeLine('');
  writeLine('<span class="t-ok">POSIX shell</span> (real interpreter over the same file system):');
  writeLine('  <span class="t-dim">sh -c "for f in /etc/*; do echo $f; done"</span>');
  writeLine('  <span class="t-dim">run /usr/sbin/lbu --help</span>   run a script from an installed package');
  writeLine('');
  writeLine('<span class="t-ok">apk</span> (real Alpine packages, signature verified locally):');
  writeLine('  <span class="t-dim">apk proxy &lt;cors-proxy-url&gt;</span>   needed once, because the browser blocks direct CORS');
  writeLine('  <span class="t-dim">apk update</span>                      fetch and verify the repository index');
  writeLine('  <span class="t-dim">apk add alpine-conf</span>              download, verify and install');
  writeLine('  <span class="t-dim">apk help</span>                         every apk subcommand');
  writeLine('');
  writeLine('<span class="t-ok">Simulator</span> (ai, model, vfs, tree, reset, shell)');
  writeLine('');
  writeLine('<span class="t-info">Plain English</span> (Route B, compiled by the local model):');
  writeLine('  Any other input is read as intent. Example: <span class="t-dim">create a folder called invoices</span>');
  writeLine('  The model returns JSON such as <span class="t-dim">{"bash":"mkdir","argument":"invoices"}</span>');
}

/**
 * Execute one native command against the VFS. Throws ShellError on failure.
 * The apk, run and sh commands are asynchronous because they may reach the
 * network or run a script, so the function is always awaited by its caller.
 */
async function executeNative(command, args) {
  switch (command) {
    case 'ls': listDirectory(args); break;
    case 'mkdir': makeDirectory(args); break;
    case 'touch': touchFiles(args); break;
    case 'rm': removeEntries(args); break;
    case 'rmdir': removeEmptyDirectories(args); break;
    case 'cd': changeDirectory(args); break;
    case 'pwd': writeLine(escapeHtml(`/home/${cfg.user}${state.cwd.length ? '/' + state.cwd.join('/') : ''}`)); break;
    case 'cat': printFile(args); break;
    case 'echo': echoText(args); break;
    case 'help': printHelp(args); break;
    case 'date': writeLine(escapeHtml(new Date().toString())); break;
    case 'whoami': writeLine(escapeHtml(cfg.user)); break;
    case 'clear': clearScreen(); break;
    case 'apk': await handleApkCommand(['apk', ...args]); break;
    case 'run': {
      if (args.length === 0) throw new ShellError('run: missing script path');
      await runShellScript(args[0], args.slice(1));
      break;
    }
    case 'sh': {
      if (args[0] === '-c') await runShellSource(args.slice(1).join(' '));
      else if (args[0]) await runShellScript(args[0], args.slice(1));
      else throw new ShellError('sh: missing script');
      break;
    }
    default: return false;
  }
  return true;
}

/** Run shell source text typed at the prompt, streaming output to the terminal. */
async function runShellSource(source) {
  const shell = new Shell({
    cwd: state.cwd,
    env: { PATH: '/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin', HOME: '/root', PS1: '$ ' }
  });
  shell.fs = VFS;
  let status = 0;
  try {
    shell.run(source, {
      stdin: '',
      stdout: (text) => shellEmitLine(text),
      stderr: (text) => shellEmitLine(text)
    });
    status = shell.lastStatus;
  } catch (error) {
    if (error instanceof ShellExit) status = error.code;
    else writeLine(escapeHtml(error?.message ?? String(error)), 't-err');
  }
  state.cwd = shell.cwd;
  if (status !== 0) writeLine(`<span class="t-dim">[sh] exit ${status}</span>`);
}

/* ---------------------------------------------------------------------
   7. Route B - Kernel AI engine (WebLLM)
   ------------------------------------------------------------------ */
const SYSTEM_PROMPT = `You are the Kernel AI inside an Ubuntu terminal simulator.
You translate one plain English request into one native terminal command.
You must answer with a single minified JSON object and nothing else.
No markdown, no code fences, no backticks, no commentary, no newlines.

Allowed keys:
{"bash": string, "argument": string, "arguments": string[], "reply": string}

Rules:
1. "bash" must be one of: ls, mkdir, touch, rm, rmdir, cd, pwd, cat, echo, clear, apk.
2. Put a single target in "argument", or several targets in "arguments".
3. Use rm with "recursive": true to delete a directory and its contents.
4. To install or remove a package, use bash "apk" with "arguments": ["add", "<package>"]
   or ["del", "<package>"].
5. Put a short spoken confirmation in "reply" only when no command applies.
6. Never invent a path that is not listed in the file system state.
7. Output JSON only.`;

const MODELS = [
  { id: MODEL_ID, label: 'Llama-3.2-1B-Instruct-q4f16_1-MLC', size: '~900 MB', note: 'default' },
  { id: 'Llama-3.2-1B-Instruct-q4f32_1-MLC', label: 'Llama-3.2-1B-Instruct-q4f32_1-MLC', size: '~1.1 GB', note: 'higher precision' },
  { id: 'Qwen2.5-0.5B-Instruct-q4f16_1-MLC', label: 'Qwen2.5-0.5B-Instruct-q4f16_1-MLC', size: '~500 MB', note: 'smallest download' }
];

const engineState = {
  library: null,
  engine: null,
  status: 'idle',
  model: MODEL_ID,
  progress: -1,
  downloadMs: 0,
  lastLatency: null,
  failures: 0
};

let enginePromise = null;

function setAiStatus(statusName) {
  engineState.status = statusName;
  if (statusName === 'checking') setStatus('checking gpu', 'busy');
  else if (statusName === 'idle') setStatus('kernel ai idle', 'ready');
  else if (statusName === 'ready') setStatus('kernel ai ready', 'ready');
  else if (statusName === 'loading') setStatus('loading model', 'busy');
  else if (statusName === 'generating') setStatus('thinking', 'busy');
  else if (statusName === 'unavailable') setStatus('kernel ai off', 'error');
  else if (statusName === 'error') setStatus('kernel ai error', 'error');
}

/** Stream WebLLM loading progress straight into the terminal output. */
function initProgressCallback(report) {
  if (!report || typeof report !== 'object') return;

  if (report.text === undefined && report.progress === undefined) {
    // Shader compilation stage: report.text is undefined during this pass.
    if (!engineState._shaderLogged) {
      engineState._shaderLogged = true;
      writeLine('<span class="t-dim">[Kernel AI] compiling WebGPU shaders...</span>');
    }
    return;
  }

  const progress = typeof report.progress === 'number' ? report.progress : 0;
  const percent = Math.max(0, Math.min(100, Math.round(progress * 100)));
  engineState.progress = percent;

  // One line per stage, throttled to whole 5% steps so the log stays readable.
  const stage = `${percent}:${report.text ?? ''}`;
  if (stage === engineState._lastStage) return;
  if (engineState._lastPercent === percent && engineState._lastText === (report.text ?? '')) return;
  engineState._lastStage = stage;
  engineState._lastPercent = percent;
  engineState._lastText = report.text ?? '';

  const bar = `[${'#'.repeat(Math.round(percent / 5)).padEnd(20, '-')}]`;
  writeLine(`<span class="t-dim">[Kernel AI] ${bar} ${String(percent).padStart(3)}% ${escapeHtml(report.text ?? 'initialising')}</span>`);
  scrollToBottom();
}

function humanizeLoadError(error) {
  const message = String(error?.message ?? error ?? '');
  if (/webgpu|gpu adapter|navigator\.gpu/i.test(message)) return 'WebGPU is unavailable in this browser.';
  if (/fetch|network|Failed to load|CORS/i.test(message)) return 'The model files could not be downloaded.';
  if (/storage|quota|OPFS/i.test(message)) return 'Browser storage is full or blocked.';
  if (/model|not found|404/i.test(message)) return 'The model could not be found on the CDN.';
  return message || 'Unknown engine failure.';
}

async function getEngine() {
  if (engineState.engine) return engineState.engine;
  if (enginePromise) return enginePromise;

  enginePromise = (async () => {
    const started = performance.now();
    setAiStatus('loading');

    writeLine('<span class="t-dim">[Kernel AI] loading @mlc-ai/web-llm from esm.run...</span>');
    const webllm = await import(/* @vite-ignore */ WEBLLM_CDN);
    engineState.library = webllm;
    writeLine(`<span class="t-ok">[Kernel AI] runtime ready (web-llm ${escapeHtml(webllm.version ?? 'unknown')})</span>`);

    writeLine(`<span class="t-dim">[Kernel AI] compiling ${escapeHtml(engineState.model)} for WebGPU...</span>`);
    const engine = await webllm.CreateMLCEngine(engineState.model, {
      initProgressCallback,
      logLevel: 'WARN'
    });

    engineState.engine = engine;
    engineState.downloadMs = Math.round(performance.now() - started);
    engineState.failures = 0;
    setAiStatus('ready');
    writeLine(`<span class="t-ok">[Kernel AI] model cached in ${(engineState.downloadMs / 1000).toFixed(1)}s. Plain English is live.</span>`);
    return engine;
  })().catch((error) => {
    enginePromise = null;
    engineState.failures += 1;
    setAiStatus('error');
    throw error;
  });

  return enginePromise;
}

function vfsSnapshot() {
  const summarize = (node, depth = 0) => {
    const pad = '  '.repeat(depth);
    const lines = [`${pad}${node.name}/`];
    for (const key of childNames(node)) {
      const child = node.children[key];
      if (child.type === 'dir') lines.push(...summarize(child, depth + 1));
      else lines.push(`${pad}  ${child.name} (${child.content.length} bytes)`);
    }
    return lines;
  };
  return summarize(VFS).join('\n');
}

function groundingMessage(request) {
  return [
    'Current working directory: ' + displayPath(state.cwd),
    'File system state:',
    vfsSnapshot(),
    '',
    'User request: ' + request,
    'JSON:'
  ].join('\n');
}

/** Pull the first balanced JSON object out of a model response. */
function extractJson(text) {
  const cleaned = String(text ?? '')
    .replace(/```[a-zA-Z]*\n?/g, '')
    .replace(/```/g, '')
    .trim();

  const start = cleaned.indexOf('{');
  if (start === -1) return null;

  let depth = 0;
  let inString = false;
  let escaped = false;
  for (let index = start; index < cleaned.length; index += 1) {
    const char = cleaned[index];
    if (inString) {
      if (escaped) escaped = false;
      else if (char === '\\') escaped = true;
      else if (char === '"') inString = false;
      continue;
    }
    if (char === '"') { inString = true; continue; }
    if (char === '{') depth += 1;
    else if (char === '}') {
      depth -= 1;
      if (depth === 0) {
        try { return JSON.parse(cleaned.slice(start, index + 1)); }
        catch { return null; }
      }
    }
  }
  return null;
}

const ACTION_ALIASES = {
  ls: 'ls', list: 'ls', dir: 'ls',
  mkdir: 'mkdir', 'make-dir': 'mkdir', 'make-directory': 'mkdir', createfolder: 'mkdir', 'create-folder': 'mkdir',
  touch: 'touch', 'create-file': 'touch', createfile: 'touch',
  rm: 'rm', remove: 'rm', delete: 'rm', erase: 'rm', del: 'rm',
  rmdir: 'rmdir', 'remove-dir': 'rmdir',
  cd: 'cd', 'change-dir': 'cd',
  pwd: 'pwd', cwd: 'pwd',
  cat: 'cat', read: 'cat', show: 'cat', print: 'cat',
  echo: 'echo',
  clear: 'clear', cls: 'clear',
  apk: 'apk', install: 'apk', package: 'apk', packages: 'apk'
};

/*
 * Shortcuts typed instead of the utility name. Only unambiguous shell-isms
 * belong here: a common English word such as "delete" or "install" must fall
 * through to the Kernel AI, otherwise the rest of the sentence is read as
 * arguments and the user gets a confusing error.
 */
const VERB_ALIASES = {
  dir: 'ls',
  cls: 'clear',
  ll: 'ls'
};

function isNativeKeyword(word) {
  const value = String(word).toLowerCase();
  return NATIVE_COMMANDS.includes(value) || value in VERB_ALIASES;
}

function normalizeArguments(action, parsed) {
  const candidates = [];
  if (typeof parsed.argument === 'string') candidates.push(parsed.argument);
  if (typeof parsed.target === 'string') candidates.push(parsed.target);
  if (typeof parsed.path === 'string') candidates.push(parsed.path);
  if (typeof parsed.name === 'string') candidates.push(parsed.name);
  if (Array.isArray(parsed.arguments)) candidates.push(...parsed.arguments);
  if (Array.isArray(parsed.targets)) candidates.push(...parsed.targets);
  if (Array.isArray(parsed.paths)) candidates.push(...parsed.paths);

  const args = candidates.map((item) => String(item).trim()).filter(Boolean);
  if (action === 'ls' && args.length === 0) args.push('.');
  if (parsed.recursive === true && action === 'rm') args.unshift('-r');
  return args;
}

/** Turn a validated model object into argv tokens for the native engine. */
function buildArgv(action, parsed) {
  const args = normalizeArguments(action, parsed);
  if (action === 'apk') {
    if (args.length === 0) throw new ShellError('apk: missing subcommand');
    return [action, ...args];
  }
  if (action === 'rm' && args.length === 0) throw new ShellError('rm: missing operand');
  if (action === 'rmdir' && args.length === 0) throw new ShellError('rmdir: missing operand');
  if (action === 'touch' && args.length === 0) throw new ShellError('touch: missing file operand');
  if (action === 'mkdir' && args.length === 0) throw new ShellError('mkdir: missing operand');
  if (action === 'cat' && args.length === 0) throw new ShellError('cat: missing operand');
  return [action, ...args];
}

/** Route B entry point. Falls back to a friendly message when the AI is off. */
async function runNaturalLanguage(request) {
  if (!cfg.aiEnabled) {
    writeBlock(
      'Kernel AI is disabled. Enable it with:  ai on\nNative Bash still works: ' + NATIVE_COMMANDS.join(', '),
      'block--error'
    );
    return;
  }

  writeLine('<span class="t-info">&#129302; [Kernel AI]: Compiling natural language intent...</span>');

  let parsed;
  try {
    const engine = await getEngine();
    setAiStatus('generating');
    const started = performance.now();
    const completion = await engine.chat.completions.create({
      messages: [
        { role: 'system', content: SYSTEM_PROMPT },
        { role: 'user', content: groundingMessage(request) }
      ],
      temperature: 0.0,
      top_p: 1.0,
      max_tokens: 200,
      stream: false
    });
    engineState.lastLatency = Math.round(performance.now() - started);
    setAiStatus('ready');
    const raw = completion?.choices?.[0]?.message?.content ?? '';
    parsed = extractJson(raw);
    if (!parsed) {
      writeLine('<span class="t-warn">[Kernel AI] the model did not return JSON. Raw output:</span>');
      writeBlock(String(raw).trim() || '(empty response)', 'block--ai');
      return;
    }
  } catch (error) {
    writeBlock(`[Kernel AI] ${humanizeLoadError(error)}\nNative Bash commands are unaffected. Retry with:  ai load`, 'block--error');
    setAiStatus('error');
    return;
  }

  const rawAction = String(parsed.bash ?? parsed.command ?? parsed.action ?? '').toLowerCase().replace(/\s+/g, '-');
  const action = ACTION_ALIASES[rawAction] ?? (NATIVE_COMMANDS.includes(rawAction) ? rawAction : null);
  const reply = typeof parsed.reply === 'string' ? parsed.reply : '';

  writeLine(`<span class="t-dim">[Kernel AI] intent decoded in ${engineState.lastLatency ?? '?'} ms &rarr; ${escapeHtml(JSON.stringify(parsed))}</span>`);

  if (!action) {
    writeLine('<span class="t-warn">[Kernel AI] no terminal command matched this request.</span>');
    if (reply) writeBlock(reply, 'block--ai');
    else writeBlock('Try naming a native command, for example: "list the Downloads folder".', 'block--ai');
    return;
  }

  if (action === 'clear') { clearScreen(); return; }

  let argv;
  try {
    argv = buildArgv(action, parsed);
  } catch (error) {
    writeBlock(`[Kernel AI] ${error.message}`, 'block--error');
    return;
  }

  const command = argv.map((part) => (/\s/.test(part) ? JSON.stringify(part) : part)).join(' ');
  writeLine(`${promptHtml()} ${escapeHtml(command)}`);
  await applyNative(argv, { echoPrompt: false });
}

/** Run argv through Route A without re-entering the router. */
async function applyNative(argv, { echoPrompt = true } = {}) {
  const [command, ...args] = argv;
  if (echoPrompt) writeLine(`${promptHtml()} ${escapeHtml(argv.join(' '))}`);
  try {
    if (!await executeNative(command, args)) throw new ShellError(`${command}: command not found`);
    return 0;
  } catch (error) {
    const message = error instanceof ShellError ? error.message : `bash: ${command}: ${error?.message ?? error}`;
    writeLine(escapeHtml(message), 't-err');
    return 1;
  }
}

/* ---------------------------------------------------------------------
   8. Shell interpreter
   --------------------------------------------------------------------- */
/* Package maintainer scripts are shell scripts. Running them needs a shell,
   so this is a small POSIX-style interpreter that operates on the VFS.

   Supported: quoting, parameter expansion, command substitution, pipelines,
   redirection, && and ||, if / while / for / case, functions, and the
   builtins listed in SHELL_BUILTINS.

   Not supported: job control, subshells as background jobs, process
   substitution, heredocs, and arithmetic expansion.
   ------------------------------------------------------------------ */

const SHELL_OPERATORS = ['&&', '||', '2>&1', '2>>', '2>', '>>', ';;', '|', ';', '>', '<', '&', '(', ')'];

/** Split shell source into tokens, keeping quotes and expansions intact. */
function shellTokenize(source) {
  const tokens = [];
  let current = '';
  let quote = '';
  let depth = 0;
  let index = 0;

  const flush = () => { if (current !== '') { tokens.push(current); current = ''; } };

  while (index < source.length) {
    const character = source[index];

    if (quote === "'") {
      current += character;
      if (character === "'") quote = '';
      index++;
      continue;
    }

    if (quote === '"') {
      if (character === '\\' && index + 1 < source.length) {
        current += character + source[index + 1];
        index += 2;
        continue;
      }
      current += character;
      if (character === '"') quote = '';
      index++;
      continue;
    }

    // Command substitution: consume the whole $( ... ) as one run.
    if (character === '$' && source[index + 1] === '(') {
      let scan = index + 2;
      let nesting = 1;
      let inner = '';
      while (scan < source.length && nesting > 0) {
        const c = source[scan];
        if (c === '\\') { inner += c + (source[scan + 1] ?? ''); scan += 2; continue; }
        if (c === '(') nesting++;
        if (c === ')') { nesting--; if (nesting === 0) break; }
        inner += c;
        scan++;
      }
      current += '$(' + inner + ')';
      index = scan + 1;
      continue;
    }

    if (character === '`') {
      const close = source.indexOf('`', index + 1);
      const inner = close === -1 ? source.slice(index + 1) : source.slice(index + 1, close);
      current += '`' + inner + '`';
      index = close === -1 ? source.length : close + 1;
      continue;
    }

    if (character === '#') {
      // A comment only starts at the beginning of a word.
      if (current === '') {
        while (index < source.length && source[index] !== '\n') index++;
        continue;
      }
    }

    if (character === "'" || character === '"') {
      quote = character;
      current += character;
      index++;
      continue;
    }

    if (character === '\\' && index + 1 < source.length) {
      current += character + source[index + 1];
      index += 2;
      continue;
    }

    if (source.startsWith(';;', index)) {
      flush();
      tokens.push(';;');
      index += 2;
      continue;
    }

    if (character === '\n' || character === ';') {
      flush();
      if (tokens[tokens.length - 1] !== ';') tokens.push(';');
      index++;
      continue;
    }

    if (/\s/.test(character)) {
      flush();
      index++;
      continue;
    }

    if (character === '(' || character === ')') {
      flush();
      tokens.push(character);
      index++;
      continue;
    }

    const operator = SHELL_OPERATORS.find((candidate) => source.startsWith(candidate, index));
    if (operator) {
      flush();
      tokens.push(operator);
      index += operator.length;
      continue;
    }

    current += character;
    index++;
  }
  flush();
  if (tokens[tokens.length - 1] === ';') tokens.pop();
  return tokens;
}

/** Split a token into words on unquoted whitespace, for globbing. */
function shellWords(value) {
  return String(value).split(/\s+/).filter(Boolean);
}

/** A failure that carries an exit code rather than a stack. */
class ShellExit extends Error {
  constructor(code = 0) {
    super(`exit ${code}`);
    this.code = code;
  }
}

/**
 * The shell. Holds variables, the working directory and the streams for one
 * script run. Package scripts get a fresh instance so they cannot leak state.
 */
class Shell {
  constructor({ stdin = '', cwd = [], env = {} } = {}) {
    this.vars = new Map(Object.entries(env));
    this.cwd = [...cwd];
    this.stdin = stdin;
    this.stdout = [];
    this.stderr = [];
    this.exitCode = 0;
    this.functions = new Map();
    this.lastStatus = 0;
    this.steps = 0;
    this.stepLimit = 20000;
    this.fs = null;
  }

  out(text) { this.stdout.push(String(text)); }

  err(text) { this.stderr.push(String(text)); }

  write(fd, text) { if (fd === 2) this.err(text); else this.out(text); }
}

/* --- word expansion --------------------------------------------------- */

function shellExpand(token, shell, { allowGlob = true } = {}) {
  if (token === '') return '';

  // Command substitution, outermost only, evaluated first.
  let value = token;

  const runSubstitution = (inner) => {
    const child = new Shell({ cwd: shell.cwd, env: Object.fromEntries(shell.vars), fs: shell.fs });
    child.functions = shell.functions;
    try {
      child.run(inner);
    } catch (error) {
      if (!(error instanceof ShellExit)) child.err(error?.message ?? String(error));
    }
    return child.stdout.join('\n').replace(/\n+$/, '');
  };

  let expanded = '';
  let index = 0;
  let quote = '';
  while (index < value.length) {
    const character = value[index];

    if (character === '\\' && quote !== "'" && index + 1 < value.length) {
      const escaped = value[index + 1];
      // Inside double quotes a backslash only escapes these four characters.
      if (quote === '"' && !'"\\$`'.includes(escaped)) {
        expanded += '\\' + escaped;
      } else {
        expanded += escaped;
      }
      index += 2;
      continue;
    }

    if (character === "'" && quote !== '"') {
      const close = value.indexOf("'", index + 1);
      const inner = close === -1 ? value.slice(index + 1) : value.slice(index + 1, close);
      expanded += inner;
      index = close === -1 ? value.length : close + 1;
      continue;
    }

    if (character === '"' && quote !== "'") {
      if (quote === '"') { quote = ''; index++; continue; }
      quote = '"';
      index++;
      continue;
    }

    if (character === '$' && value[index + 1] === '(' && value[index + 2] === '(') {
      const close = value.indexOf('))', index + 3);
      if (close !== -1) {
        expanded += String(shellArithmetic(value.slice(index + 3, close), shell));
        index = close + 2;
        continue;
      }
    }

    if (character === '$' && value[index + 1] === '(') {
      let scan = index + 2;
      let nesting = 1;
      let inner = '';
      while (scan < value.length && nesting > 0) {
        const c = value[scan];
        if (c === '(') nesting++;
        if (c === ')') { nesting--; if (nesting === 0) break; }
        inner += c;
        scan++;
      }
      expanded += runSubstitution(inner);
      index = scan + 1;
      continue;
    }

    if (character === '`') {
      const close = value.indexOf('`', index + 1);
      const inner = close === -1 ? value.slice(index + 1) : value.slice(index + 1, close);
      expanded += runSubstitution(inner);
      index = close === -1 ? value.length : close + 1;
      continue;
    }

    if (character === '$' && value[index + 1] === '{') {
      const close = value.indexOf('}', index + 2);
      if (close === -1) { expanded += character; index++; continue; }
      const expression = value.slice(index + 2, close);
      expanded += shellParameter(shell, expression);
      index = close + 1;
      continue;
    }

    if (character === '$') {
      const match = /^\$([A-Za-z_][A-Za-z0-9_]*|[0-9@*#?$!-])/.exec(value.slice(index));
      if (match) {
        expanded += shellParameter(shell, match[1]);
        index += match[0].length;
        continue;
      }
    }

    expanded += character;
    index++;
  }

  if (!allowGlob) return expanded;
  if (!/[*?]/.test(expanded)) return expanded;
  return shellGlob(expanded, shell).join('\u0000') === '' ? expanded : shellGlob(expanded, shell).join('\u0000');
}

/**
 * Evaluate an arithmetic expression for $(( ... )).
 * Supports + - * / % and parentheses. Not a full integer expression parser.
 */
function shellArithmetic(expression, shell) {
  const source = expression.replace(/\$?([A-Za-z_][A-Za-z0-9_]*)/g, (_, name) => {
    const value = shell.vars.get(name);
    return value === undefined || value === '' ? '0' : String(value);
  });

  let at = 0;
  const skipSpace = () => { while (at < source.length && /\s/.test(source[at])) at++; };

  const parsePrimary = () => {
    skipSpace();
    if (source[at] === '(') {
      at++;
      const value = parseSum();
      skipSpace();
      if (source[at] === ')') at++;
      return value;
    }
    if (source[at] === '-') { at++; return -parsePrimary(); }
    const match = /^\d+/.exec(source.slice(at));
    if (!match) { at++; return 0; }
    at += match[0].length;
    return Number(match[0]);
  };

  const parseProduct = () => {
    let value = parsePrimary();
    for (;;) {
      skipSpace();
      const operator = source[at];
      if (operator !== '*' && operator !== '/' && operator !== '%') return value;
      at++;
      const right = parsePrimary();
      if (operator === '*') value *= right;
      else if (operator === '/') value = right === 0 ? 0 : Math.trunc(value / right);
      else value = right === 0 ? 0 : value % right;
    }
  };

  function parseSum() {
    let value = parseProduct();
    for (;;) {
      skipSpace();
      const operator = source[at];
      if (operator !== '+' && operator !== '-') return value;
      at++;
      const right = parseProduct();
      value = operator === '+' ? value + right : value - right;
    }
  }

  return parseSum();
}

/** Resolve a ${...} or $X expression. */
function shellParameter(shell, expression) {
  const defaultValue = /^([A-Za-z_][A-Za-z0-9_]*):-([\s\S]*)$/.exec(expression);
  if (defaultValue) {
    const current = shell.vars.get(defaultValue[1]);
    return current === undefined || current === '' ? defaultValue[2] : current;
  }
  const assignDefault = /^([A-Za-z_][A-Za-z0-9_]*):=([\s\S]*)$/.exec(expression);
  if (assignDefault) {
    const current = shell.vars.get(assignDefault[1]);
    if (current === undefined || current === '') {
      shell.vars.set(assignDefault[1], assignDefault[2]);
      return assignDefault[2];
    }
    return current;
  }
  if (expression === '@' || expression === '*') return (shell.vars.get('@') ?? '').split('\u0001').join(' ');
  if (expression === '#') return String(shell.vars.get('#') ?? 0);
  if (expression === '?') return String(shell.lastStatus);
  if (/^\d+$/.test(expression)) {
    const positional = shell.vars.get('@');
    if (positional === undefined) return '';
    return positional.split('\u0001')[Number(expression) - 1] ?? '';
  }
  return shell.vars.get(expression) ?? '';
}

/** Expand a glob pattern against the VFS. Returns matching paths. */
function shellGlob(pattern, shell) {
  const base = pattern.startsWith('/') ? [] : [...shell.cwd];
  const segments = pattern.split('/');
  let candidates = [base];

  for (const segment of segments) {
    if (segment === '' || segment === '.') continue;
    const next = [];
    for (const prefix of candidates) {
      if (!/[*?]/.test(segment)) {
        const tokens = segment === '..' ? prefix.slice(0, -1) : [...prefix, segment];
        if (shellLookup(shell, tokens)) next.push(tokens);
        continue;
      }
      const parent = shellLookup(shell, prefix);
      if (!parent || !isDir(parent)) continue;
      const expression = new RegExp('^' + segment.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\?/g, '.') + '$');
      for (const name of Object.keys(parent.children)) {
        if (expression.test(name)) next.push([...prefix, name]);
      }
    }
    candidates = next;
  }

  return candidates.map((tokens) => (pattern.startsWith('/') ? '/' : '') + tokens.join('/')).filter(Boolean);
}

/* --- VFS access from the shell --------------------------------------- */

function shellLookup(shell, tokens) {
  let node = shell.fs ?? VFS;
  for (const token of tokens) {
    if (!isDir(node)) return null;
    node = node.children[token];
    if (!node) return null;
  }
  return node;
}

/** Resolve a shell path string into VFS tokens. */
function shellResolve(shell, path) {
  const value = String(path);
  if (value === '' || value === '.') return [...shell.cwd];
  if (value === '/') return [];
  if (value.startsWith('/')) return normalizeSegments(value.split('/'));
  return normalizeSegments([...shell.cwd, ...value.split('/')]);
}

function shellParent(shell, path) {
  const tokens = shellResolve(shell, path);
  const name = tokens[tokens.length - 1];
  const parentTokens = tokens.slice(0, -1);
  const parent = shellLookup(shell, parentTokens);
  return isDir(parent) && name ? { parent, name, tokens } : null;
}

function shellPath(shell, path) {
  const tokens = shellResolve(shell, path);
  return tokens.length === 0 ? '/' : '/' + tokens.join('/');
}

/** Create every missing directory on the path, like mkdir -p. */
function shellEnsureDir(shell, path) {
  const tokens = shellResolve(shell, path);
  let node = shell.fs ?? VFS;
  for (const token of tokens) {
    if (!isDir(node.children[token])) node.children[token] = makeDir(token, {});
    node = node.children[token];
  }
  return node;
}

function shellWriteFile(shell, path, content, { append = false } = {}) {
  const resolved = shellParent(shell, path);
  if (!resolved) throw new Error(`cannot create ${path}`);
  const existing = resolved.parent.children[resolved.name];
  if (append && existing && existing.type === 'file') {
    existing.content += content;
    return existing;
  }
  resolved.parent.children[resolved.name] = makeFile(resolved.name, content, { from: 'shell' });
  return resolved.parent.children[resolved.name];
}

function shellReadFile(shell, path) {
  const node = shellLookup(shell, shellResolve(shell, path));
  if (!node) return null;
  if (node.type === 'dir') return null;
  return node.content ?? '';
}

/* --- parser ----------------------------------------------------------- */

const RESERVED_WORDS = new Set([
  'if', 'then', 'else', 'elif', 'fi', 'while', 'until', 'for', 'in', 'do', 'done',
  'case', 'esac', 'function', '{', '}', '(', ')'
]);

/**
 * Recursive descent parser over the token list.
 * Produces a small AST the executor walks.
 */
class ShellParser {
  constructor(tokens) {
    this.tokens = tokens;
    this.at = 0;
  }

  peek(offset = 0) { return this.tokens[this.at + offset]; }

  next() { return this.tokens[this.at++]; }

  atEnd() { return this.at >= this.tokens.length; }

  isReserved(word) { return typeof word === 'string' && RESERVED_WORDS.has(word); }

  /** Consume tokens until the reserved word that closes the current block. */
  takeUntilReserved(stops) {
    const collected = [];
    let depth = 0;
    while (!this.atEnd()) {
      const token = this.peek();
      if (depth === 0 && stops.includes(token)) break;
      if (token === 'if' || token === 'while' || token === 'until' || token === 'for' || token === 'case') depth++;
      if (token === 'fi' || token === 'done' || token === 'esac') depth--;
      collected.push(this.next());
    }
    return collected;
  }

  parseScript(stops = []) {
    const body = this.takeUntilReserved(stops);
    return this.parseList(body);
  }

  parseList(tokens) {
    const parser = new ShellParser(tokens);
    const items = [];
    while (!parser.atEnd()) {
      if (parser.peek() === ';') { parser.next(); continue; }
      const before = parser.at;
      items.push(parser.parseAndOr());
      // Guarantee forward progress. A stray reserved word such as a trailing
      // 'fi' or 'esac' would otherwise make parseAndOr return an empty node
      // without consuming anything, and this loop would never end.
      if (parser.at === before) parser.next();
      if (parser.peek() === ';') parser.next();
    }
    return { type: 'list', items };
  }

  parseAndOr() {
    let node = this.parsePipeline();
    while (this.peek() === '&&' || this.peek() === '||') {
      const operator = this.next();
      const right = this.parsePipeline();
      node = { type: 'andor', left: node, operator, right };
    }
    return node;
  }

  parsePipeline() {
    const commands = [this.parseCommand()];
    while (this.peek() === '|') {
      this.next();
      commands.push(this.parseCommand());
    }
    return { type: 'pipeline', commands };
  }

  parseCommand() {
    const token = this.peek();

    if (token === 'if') return this.parseIf();
    if (token === 'while' || token === 'until') return this.parseWhile();
    if (token === 'for') return this.parseFor();
    if (token === 'case') return this.parseCase();
    if (token === '{') return this.parseBraceGroup();
    if (token === '(') return this.parseSubshell();

    // A function definition looks like: name () { ... }
    if (typeof token === 'string' && /^[A-Za-z_][A-Za-z0-9_]*$/.test(token)
      && this.peek(1) === '(' && this.peek(2) === ')') {
      const name = this.next();
      this.next();
      this.next();
      const body = this.parseCommand();
      return { type: 'function', name, body };
    }

    return this.parseSimple();
  }

  parseSimple() {
    const words = [];
    const redirects = [];
    while (!this.atEnd()) {
      const token = this.peek();
      if (token === ';' || token === '&&' || token === '||' || token === '|' || token === ')') break;
      if (token === '>' || token === '>>' || token === '<' || token === '2>&1') {
        this.next();
        const target = this.next() ?? '';
        redirects.push({ operator: token, target });
        continue;
      }
      if (this.isReserved(token)) break;
      words.push(this.next());
    }
    return { type: 'simple', words, redirects };
  }

  parseIf() {
    this.next(); // if
    const condition = this.parseScript(['then']);
    this.next(); // then
    const thenBody = this.parseScript(['elif', 'else', 'fi']);
    const branches = [];
    let elseBody = null;
    while (this.peek() === 'elif') {
      this.next();
      const branchCondition = this.parseScript(['then']);
      this.next(); // then
      branches.push({ condition: branchCondition, body: this.parseScript(['elif', 'else', 'fi']) });
    }
    if (this.peek() === 'else') {
      this.next();
      elseBody = this.parseScript(['fi']);
    }
    if (this.peek() === 'fi') this.next();
    return { type: 'if', condition, thenBody, branches, elseBody };
  }

  parseWhile() {
    const until = this.next() === 'until';
    const condition = this.parseScript(['do']);
    this.next(); // do
    const body = this.parseScript(['done']);
    if (this.peek() === 'done') this.next();
    return { type: 'while', until, condition, body };
  }

  parseFor() {
    this.next(); // for
    const name = this.next();
    let words = [];
    if (this.peek() === 'in') {
      this.next();
      while (!this.atEnd() && this.peek() !== ';' && this.peek() !== 'do') words.push(this.next());
    }
    if (this.peek() === ';') this.next();
    if (this.peek() === 'do') this.next();
    const body = this.parseScript(['done']);
    if (this.peek() === 'done') this.next();
    return { type: 'for', name, words, body };
  }

  parseCase() {
    this.next(); // case
    const word = this.next();
    if (this.peek() === 'in') this.next();
    const items = [];
    while (!this.atEnd() && this.peek() !== 'esac') {
      if (this.peek() === ';') { this.next(); continue; }
      const patterns = [];
      while (!this.atEnd() && this.peek() !== ')') patterns.push(this.next());
      if (this.peek() === ')') this.next();
      const bodyTokens = [];
      let depth = 0;
      while (!this.atEnd()) {
        const token = this.peek();
        if (token === 'if' || token === 'while' || token === 'for' || token === 'case') depth++;
        if (token === 'fi' || token === 'done' || token === 'esac') depth--;
        if (depth === 0 && token === ';;') { this.next(); break; }
        if (depth === 0 && token === 'esac') break;
        bodyTokens.push(this.next());
      }
      items.push({ patterns: patterns.join(' ').split('|'), body: this.parseList(bodyTokens) });
    }
    if (this.peek() === 'esac') this.next();
    return { type: 'case', word, items };
  }

  parseBraceGroup() {
    this.next(); // {
    const body = this.parseScript(['}']);
    if (this.peek() === '}') this.next();
    return { type: 'group', body };
  }

  parseSubshell() {
    this.next(); // (
    const body = this.parseScript([')']);
    if (this.peek() === ')') this.next();
    return { type: 'subshell', body };
  }
}

/* --- executor --------------------------------------------------------- */

class ShellReturn extends Error {
  constructor(code) { super(`return ${code}`); this.code = code; }
}

/** Execute an AST node. Returns the exit status. */
function shellExecNode(node, shell, io) {
  if (!node) return 0;
  if (++shell.steps > shell.stepLimit) throw new ShellExit(1);

  switch (node.type) {
    case 'list': {
      let status = 0;
      for (const item of node.items) status = shellExecNode(item, shell, io);
      return status;
    }
    case 'andor': {
      const left = shellExecNode(node.left, shell, io);
      if (node.operator === '&&') return left === 0 ? shellExecNode(node.right, shell, io) : left;
      return left !== 0 ? shellExecNode(node.right, shell, io) : left;
    }
    case 'pipeline':
      return shellExecPipeline(node, shell, io);
    case 'simple':
      return shellExecSimple(node, shell, io);
    case 'if': {
      if (shellExecNode(node.condition, shell, io) === 0) return shellExecNode(node.thenBody, shell, io);
      for (const branch of node.branches) {
        if (shellExecNode(branch.condition, shell, io) === 0) return shellExecNode(branch.body, shell, io);
      }
      return node.elseBody ? shellExecNode(node.elseBody, shell, io) : 0;
    }
    case 'while': {
      let status = 0;
      let guard = 0;
      for (;;) {
        if (++guard > 100000) break;
        const condition = shellExecNode(node.condition, shell, io);
        const keepGoing = node.until ? condition !== 0 : condition === 0;
        if (!keepGoing) break;
        status = shellExecNode(node.body, shell, io);
      }
      return status;
    }
    case 'for': {
      const values = [];
      for (const word of node.words) {
        const expanded = shellExpand(word, shell, { allowGlob: false });
        values.push(...shellWords(expanded));
      }
      let status = 0;
      for (const value of values) {
        shell.vars.set(node.name, value);
        status = shellExecNode(node.body, shell, io);
      }
      return status;
    }
    case 'case': {
      const value = shellExpand(node.word, shell, { allowGlob: false });
      for (const item of node.items) {
        for (const pattern of item.patterns) {
          const expression = new RegExp('^' + pattern.trim()
            .replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\?/g, '.') + '$');
          if (expression.test(value)) return shellExecNode(item.body, shell, io);
        }
      }
      return 0;
    }
    case 'group':
    case 'subshell':
      return shellExecNode(node.body, shell, io);
    case 'function':
      shell.functions.set(node.name, node.body);
      return 0;
    default:
      return 0;
  }
}

/** Run a pipeline, feeding each command's stdout into the next stdin. */
function shellExecPipeline(node, shell, io) {
  let input = io.stdin;
  let status = 0;
  for (let index = 0; index < node.commands.length; index++) {
    const command = node.commands[index];
    const captured = [];
    const isLast = index === node.commands.length - 1;
    const stageIo = {
      stdin: input,
      stdout: (text) => (isLast ? io.stdout(text) : captured.push(text)),
      stderr: io.stderr
    };
    status = shellExecNode(command, shell, stageIo);
    input = captured.join('');
  }
  return status;
}

/** Collect the words of a simple command, expanding and globbing. */
function shellExpandWords(words, shell) {
  const expanded = [];
  for (const word of words) {
    const value = shellExpand(word, shell);
    if (value.includes('\u0000')) expanded.push(...value.split('\u0000'));
    else if (value !== '') expanded.push(value);
  }
  return expanded;
}

function shellExecSimple(node, shell, io) {
  const argv = shellExpandWords(node.words, shell);

  // A bare assignment (NAME=value) sets a variable and produces no output.
  if (argv.length > 0 && /^[A-Za-z_][A-Za-z0-9_]*=/.test(argv[0])) {
    for (const word of argv) {
      const equals = word.indexOf('=');
      if (equals <= 0) continue;
      shell.vars.set(word.slice(0, equals), word.slice(equals + 1));
    }
    shell.lastStatus = 0;
    return 0;
  }

  if (argv.length === 0) return 0;

  // Apply redirections to this command's streams.
  let stdout = io.stdout;
  let stderr = io.stderr;
  let stdin = io.stdin;

  for (const redirect of node.redirects) {
    const target = shellExpand(redirect.target, shell, { allowGlob: false });
    if (redirect.operator === '2>&1') { stderr = stdout; continue; }
    if (redirect.operator === '<') { stdin = shellReadFile(shell, target) ?? ''; continue; }
    if (redirect.operator === '2>' || redirect.operator === '2>>') {
      const buffer = [];
      stderr = (text) => buffer.push(text);
      stderr.flush = () => shellWriteFile(shell, shellPath(shell, target), buffer.join(''),
        { append: redirect.operator === '2>>' });
      continue;
    }
    const path = shellPath(shell, target);
    const buffer = [];
    stdout = (text) => buffer.push(text);
    stdout.flush = () => {
      shellWriteFile(shell, path, buffer.join(''), { append: redirect.operator === '>>' });
    };
  }

  const status = shellRunCommand(argv, shell, { stdin, stdout, stderr });
  for (const stream of [stdout, stderr]) if (typeof stream.flush === 'function') stream.flush();
  shell.lastStatus = status;
  return status;
}

/** Dispatch one command: function, builtin, then external simulation. */
function shellRunCommand(argv, shell, io) {
  const [name, ...args] = argv;

  if (shell.functions.has(name)) {
    const body = shell.functions.get(name);
    // A function sees its own positional parameters, saved and restored around
    // the call so the caller's $1 and $@ survive.
    const savedPositional = shell.vars.get('@');
    const savedCount = shell.vars.get('#');
    shell.vars.set('@', args.join('\u0001'));
    shell.vars.set('#', String(args.length));
    try {
      return shellExecNode(body, shell, io);
    } catch (error) {
      if (error instanceof ShellReturn) return error.code;
      throw error;
    } finally {
      if (savedPositional === undefined) shell.vars.delete('@');
      else shell.vars.set('@', savedPositional);
      if (savedCount === undefined) shell.vars.delete('#');
      else shell.vars.set('#', savedCount);
    }
  }

  if (SHELL_BUILTINS[name]) return SHELL_BUILTINS[name](args, shell, io);
  return shellRunExternal(name, args, shell, io);
}

/* --- builtins --------------------------------------------------------- */

/**
 * Builtins, keyed by name. Each returns an exit status.
 * Path helpers keep the code short: everything operates on the VFS.
 */
const SHELL_BUILTINS = {
  ':': () => 0,
  true: () => 0,
  false: () => 1,

  echo(args, shell, io) {
    let newline = true;
    let index = 0;
    if (args[0] === '-n') { newline = false; index = 1; }
    let text = args.slice(index).join(' ');
    // busybox ash and dash both interpret backslash escapes in echo.
    let stop = false;
    text = text.replace(/\\([ntr0\\c])/g, (_, code) => {
      if (code === 'c') { stop = true; return ''; }
      return { n: '\n', t: '\t', r: '\r', '0': '\0', '\\': '\\' }[code];
    });
    if (stop) { io.stdout(text); return 0; }
    io.stdout(newline ? text + '\n' : text);
    return 0;
  },

  printf(args, shell, io) {
    if (args.length === 0) return 0;
    const format = args[0];
    const values = args.slice(1);
    let at = 0;
    const output = format
      .replace(/\\([ntr\\])/g, (_, c) => ({ n: '\n', t: '\t', r: '\r', '\\': '\\' }[c]))
      .replace(/%[sdi]/g, () => values[at++] ?? '');
    io.stdout(output);
    return 0;
  },

  pwd(args, shell, io) { io.stdout(shellPath(shell, '.') + '\n'); return 0; },

  cd(args, shell, io) {
    const target = args[0] ?? '~';
    if (target === '~' || target === '$HOME') { shell.cwd = []; return 0; }

    const node = shellLookup(shell, tokens);
    if (!node) { io.stderr(`sh: cd: ${target}: No such file or directory\n`); return 1; }
    if (!isDir(node)) { io.stderr(`sh: cd: ${target}: Not a directory\n`); return 1; }

    return 0;
  },

  local(args, shell) {
    // Treated as a plain assignment. Scripts use local for isolation, which a
    // single-scope interpreter cannot provide, but the value must still be set.
    for (const assignment of args) {
      const equals = assignment.indexOf('=');
      if (equals <= 0) continue;
      shell.vars.set(assignment.slice(0, equals), assignment.slice(equals + 1));
    }
    return 0;
  },

  export(args, shell) {
    for (const assignment of args) {
      const equals = assignment.indexOf('=');
      if (equals === -1) continue;
      shell.vars.set(assignment.slice(0, equals), assignment.slice(equals + 1));
    }
    return 0;
  },

  unset(args, shell) {
    for (const name of args) shell.vars.delete(name);
    return 0;
  },

  set(args, shell) {
    if (args.length === 0) return 0;
    if (args[0] === '--') return 0;
    return 0;
  },

  shift(args, shell) {
    const positional = (shell.vars.get('@') ?? '').split('\u0001');
    positional.shift();
    shell.vars.set('@', positional.join('\u0001'));
    return 0;
  },

  read(args, shell, io) {
    const name = args[0] ?? 'REPLY';
    const [line = ''] = String(io.stdin ?? '').split('\n');
    shell.vars.set(name, line.trim());
    return 0;
  },

  test(args, shell, io) { return shellTest(args, shell, io); },
  '['(args, shell, io) {
    const trimmed = args[args.length - 1] === ']' ? args.slice(0, -1) : args;
    return shellTest(trimmed, shell, io);
  },

  mkdir(args, shell, io) {
    let parents = false;
    const targets = [];
    for (const arg of args) {
      if (arg === '-p') { parents = true; continue; }
      if (arg.startsWith('-')) continue;
      targets.push(arg);
    }
    let status = 0;
    for (const target of targets) {
      const tokens = shellResolve(shell, target);
      const existing = shellLookup(shell, tokens);
      if (existing) {
        if (parents && isDir(existing)) continue;
        io.stderr(`mkdir: can't create directory '${target}': File exists\n`);
        status = 1;
        continue;
      }
      if (parents) { shellEnsureDir(shell, target); continue; }
      const resolved = shellParent(shell, target);
      if (!resolved) { io.stderr(`mkdir: can't create directory '${target}': No such file or directory\n`); status = 1; continue; }
      resolved.parent.children[resolved.name] = makeDir(resolved.name, {});
    }
    return status;
  },

  rmdir(args, shell, io) {
    let status = 0;
    for (const target of args.filter((a) => !a.startsWith('-'))) {
      const resolved = shellParent(shell, target);
      const node = resolved?.parent.children[resolved.name];
      if (!node || !isDir(node)) { io.stderr(`rmdir: '${target}': No such file or directory\n`); status = 1; continue; }
      if (Object.keys(node.children).length > 0) { io.stderr(`rmdir: '${target}': Directory not empty\n`); status = 1; continue; }

  rm(args, shell, io) {

    let force = false;
    const targets = [];
    for (const arg of args) {

      if (arg.startsWith('-') && arg.length > 1) {

        if (arg.includes('f')) force = true;

    for (const target of targets) {
      const tokens = shellResolve(shell, target);
      const node = shellLookup(shell, tokens);

  tail(args, shell, io) {
    let count = 10;

    from.forEach((character, index) => map.set(character, to[index] ?? to[to.length - 1] ?? character));

      words: source.split(/\s+/).filter(Boolean).length,
      chars: source.length

    else if (args.includes('-w')) io.stdout(`${counts.words}\n`);
    else if (args.includes('-c')) io.stdout(`${counts.chars}\n`);

  basename(args, io) {
    const target = String(args[0] ?? '').replace(/\/+$/, '');
    io.stdout((target.split('/').pop() ?? '') + '\n');
    return 0;
  },

  dirname(args, io) {
    const parts = String(args[0] ?? '').split('/');

    io.stdout((parts.join('/') || '.') + '\n');
    return 0;

  whoami(args, shell, io) { io.stdout('root\n'); return 0; },
  hostname(args, shell, io) { io.stdout('sandbox-vm\n'); return 0; },
  uname(args, shell, io) { io.stdout('Linux sandbox-vm 6.14.0-generic #1 SMP x86_64 GNU/Linux\n'); return 0; },
  date(args, shell, io) { io.stdout(new Date().toString() + '\n'); return 0; },
  sleep(args) { return 0; },
  sync(args) { return 0; },
  free(args, shell, io) { io.stdout('              total        used        free\nMem:        2048000      431104     1616896\n'); return 0; },
  df(args, shell, io) { io.stdout('Filesystem     1K-blocks    Used Available Use% Mounted on\n/dev/vda1        8388608 3222528   5166080  38% /\n'); return 0; },
